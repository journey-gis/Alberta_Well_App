<html>
    <head>
    	<!-- Load plotly.js into the DOM -->
    	<script src='https://cdn.plot.ly/plotly-4.1.1.min.js'></script>

        <!-- Link to the latest Leaflet stylesheet --> 
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" 
        crossorigin=""/> 

        <link rel="stylesheet" href="style.css">
        
        <!-- Link to the latest Leaflet JavaScript library -->  
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" 
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" 
        crossorigin=""></script> 

        <!-- Load my main code -->
        <script src="welldata.js" defer></script>
        <script src="culture.js" defer></script>
        <script src="albertawellapp.js" defer></script>
    </head>

  <body>

    <div class="sidenav">
        <div class="slidecontainer">
            <label for="areaselect">Select Field to Examine</label>
            <select id="areaselect">
                <option value="">Area</option>
                <option value="ELM">Elmworth Field</option>
                <option value="PEM">Pembina Field</option>
            </select>
            <br><br>
            <label for="yearRange">Select Year (2016 - ??)</label>
            <input type="range" min="2016" max="2026" value="2016" class="slider" id="yearRange">
            <p>End Year: <span id="selectedYear"></span></p>
        </div>
    </div>
    <div class="main">
        <h1>Well Development in Alberta Over the Last Decade (2016-present)</h1>
  	    <div id='wellMap'></div><!-- leaflet map to display inside this DIV --></div>
        <footer>
            <p>Data Citation: openalberta.ca (Boundary), aer.ca (Wells)<br>
            AI Acknowledgement: Microsoft Co-pilot used for code reference<br>
            Keith Johnson, November 2026</p>
        </footer>
    </div>
  </body>
</html>
