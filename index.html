    <div class="sidenav">
        <div class="slidecontainer">
            <label for="areaselect">Select Area to Examine</label>

                <option value="GP">Grand Prairie</option>

                <option value="EDM">Edmonton</option>
            </select>
            <br><br>
            <label for="yearRange">Select Year (1949 - ??)</label>
            <input type="range" min="1949" max="2026" value="2026" class="slider" id="yearRange">
            <p>End Year: <span id="selectedYear"></span></p>
        </div>
